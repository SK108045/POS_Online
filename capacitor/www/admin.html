<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Oraforge POS — Admin Portal</title>
  <link rel="stylesheet" href="admin.css">
  <script>
    (function() {
      var t = localStorage.getItem('pos_theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <div class="admin-shell">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo">
          <div class="logo-icon" id="adminBusinessIcon">🏪</div>
          <span class="name" id="adminBusinessName">Admin Portal</span>
        </div>
        <div class="tag" id="adminPortalTag">Oraforge POS Admin</div>
        <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">
          <span></span><span></span><span></span>
        </button>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-item active" data-section="dashboard">
          <span class="nav-icon">&#9646;</span>
          <span class="nav-label">Dashboard</span>
        </div>
        <div class="nav-item" data-section="users">
          <span class="nav-icon">&#9646;</span>
          <span class="nav-label">Staff</span>
        </div>
        <div class="nav-item" data-section="menu">
          <span class="nav-icon">&#9646;</span>
          <span class="nav-label" id="adminProductsLabel">Products</span>
        </div>
        <div class="nav-item" data-section="customers">
          <span class="nav-icon">&#9646;</span>
          <span class="nav-label">Customers</span>
        </div>
        <div class="nav-item" data-section="promotions">
          <span class="nav-icon">&#9646;</span>
          <span class="nav-label">Customer Marketing</span>
        </div>
        <div class="nav-item" data-section="pos">
          <span class="nav-icon">🖥️</span>
          <span class="nav-label">Back to POS</span>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="user-card">
          <div class="user-avatar" id="userAvatarLetter">A</div>
          <div class="user-info">
            <div class="user-name" id="userDisplayName">The Owner</div>
            <div class="user-role">Manager</div>
          </div>
        </div>
        <a class="logout-btn" href="index.html" onclick="localStorage.removeItem('pos_logged_in'); sessionStorage.removeItem('pos_admin_logged_in');">Logout</a>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main-content">
      <div class="content-section active" id="sec-dashboard"></div>
      <div class="content-section" id="sec-users"></div>
      <div class="content-section" id="sec-menu"></div>
      <div class="content-section" id="sec-customers"></div>
      <div class="content-section" id="sec-promotions"></div>
    </main>
  </div>

  <!-- FLOATING OPEN BUTTON (shown when sidebar is collapsed) -->
  <button class="sidebar-open-btn" id="sidebarOpenBtn" title="Open sidebar">
    <span></span><span></span><span></span>
  </button>

  <!-- TOAST CONTAINER -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="sqlite-bridge.js"></script>
  <script src="shop-registry.js" defer></script>
  <script src="admin.js" defer></script>
  <script src="admin-shop-sync.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const shell = document.querySelector('.admin-shell');
      const closeBtn = document.getElementById('sidebarToggle');
      const openBtn = document.getElementById('sidebarOpenBtn');
      if (window.innerWidth <= 860) shell.classList.add('collapsed');
      if (closeBtn) closeBtn.addEventListener('click', () => shell.classList.add('collapsed'));
      if (openBtn) openBtn.addEventListener('click', () => shell.classList.remove('collapsed'));
    });
  </script>
</body>
</html>
