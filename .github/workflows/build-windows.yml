name: Build Windows POS EXE

on:
  workflow_dispatch:
  push:
    branches: [improved-ui, windows-exe-automation, feat/windows-etims-checkout]
    tags: ['windows-v*']
  pull_request:
    branches: [improved-ui]

permissions:
  contents: read

concurrency:
  group: windows-pos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Validate and package Node + Windows launcher
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: capacitor/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Install locked dependencies
        run: npm ci --prefix capacitor
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install helper test dependencies
        run: python -m pip install -r windows/etims-helper/requirements.txt
      - name: Validate source and run regression tests
        run: |
          node --check capacitor/dev-server.js
          node --check capacitor/swifta.js
          node --check capacitor/sms.js
          for file in capacitor/www/*.js; do node --check "$file"; done
          node --test capacitor/tests/*.cjs
          python3 -m unittest discover -s windows/etims-helper -p test_companion.py
          python3 -m py_compile windows/build.py windows/verify_package.py windows/legacy_backend.py
          git diff --check
      - name: Build portable Windows x64 app
        run: python3 windows/build.py
      - name: Verify binaries, credentials and ZIP
        run: python3 windows/verify_package.py
      - name: Smoke test packaged Node server
        run: POS_TEST_SERVER=dist/windows/OraforgePOS/app/capacitor/dev-server.js node --test windows/server-smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: oraforge-pos-windows-node-stage
          path: dist/windows/OraforgePOS/
          retention-days: 1
          if-no-files-found: error

  windows:
    name: Test Windows Node/Python and build installer
    runs-on: windows-2022
    needs: portable
    permissions:
      contents: write # Required only when publishing a tag release
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: oraforge-pos-windows-node-stage
          path: dist/windows/OraforgePOS
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Bundle Python backend with its CPython runtime
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0 -r requirements.txt tzdata
          $assets = (Resolve-Path static).Path
          python -m PyInstaller --noconfirm --clean --onedir --name OraforgePOSPython --distpath dist/windows/OraforgePOS/runtime/python --workpath dist/windows/pybuild --specpath dist/windows/pybuild --add-data "$assets;static" --collect-all tzdata windows/legacy_backend.py --paths .
          if ($LASTEXITCODE -ne 0) { throw 'Python backend packaging failed' }
          if (!(Test-Path 'dist/windows/OraforgePOS/runtime/python/OraforgePOSPython/OraforgePOSPython.exe')) { throw 'Python EXE missing' }
      - name: Bundle Windows eTIMS UI helper
        shell: pwsh
        run: |
          python -m pip install -r windows/etims-helper/requirements.txt
          python -m unittest discover -s windows/etims-helper -p test_companion.py
          ./windows/build-etims-helper.ps1
      - name: Native Windows Node launcher smoke test
        shell: pwsh
        run: ./windows/desktop-smoke.ps1 -PackageDirectory (Resolve-Path dist/windows/OraforgePOS)
      - name: Native Windows Python backend smoke test
        shell: pwsh
        run: ./windows/legacy-smoke.ps1 -PackageDirectory (Resolve-Path dist/windows/OraforgePOS)
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build installer and ZIP with Node/Python engines
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path 'dist/windows/OraforgePOS').Path
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler unavailable: $iscc" }
          $out = Join-Path (Get-Location) 'dist/windows/installer'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^windows-v', '' } else { '1.0.' + $env:GITHUB_RUN_NUMBER }
          & $iscc "/DSourceDir=$root" "/DOutputDir=$out" "/DAppVersion=$version" "windows/OraforgePOS.iss"
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
          $zip = 'dist/windows/OraforgePOS-Windows-x64.zip'
          Compress-Archive -Path 'dist/windows/OraforgePOS' -DestinationPath $zip -CompressionLevel Optimal -Force
          foreach ($file in @($zip, (Join-Path $out 'OraforgePOS-Setup-Windows-x64.exe'))) {
            if (!(Test-Path $file)) { throw "Missing distribution file: $file" }
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $file -Leaf)" | Set-Content -Encoding ascii "$file.sha256"
          }
          Write-Output 'PASS: installer and full portable package built'
      - name: Verify complete distribution including Python runtime
        shell: pwsh
        run: |
          $base = 'dist/windows/OraforgePOS'
          $py = "$base/runtime/python/OraforgePOSPython/OraforgePOSPython.exe"
          if (!(Test-Path $py)) { throw 'Python bundled runtime missing' }
          if ((Get-Item $py).Length -lt 100000) { throw 'Frozen Python backend too small' }
          $helper = "$base/runtime/etims/OraforgeEtims/OraforgeEtims.exe"
          if (!(Test-Path $helper)) { throw 'Frozen eTIMS helper missing' }
          if ((Get-Item $helper).Length -lt 100000) { throw 'Frozen eTIMS helper too small' }
          if ((Get-Item "$base/app/swifta.txt").Length -ne 0) { throw 'Swifta key was packaged' }
          $sms = Get-Content "$base/app/capacitor/sozuri-config.json" -Raw | ConvertFrom-Json
          if ($sms.apiKey) { throw 'SMS key was packaged' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path 'dist/windows/OraforgePOS-Windows-x64.zip'))
          try {
            if (!($zip.Entries.FullName -match 'runtime/python/OraforgePOSPython/OraforgePOSPython.exe')) { throw 'Portable ZIP missing Python backend' }
            if (!($zip.Entries.FullName -match 'runtime/etims/OraforgeEtims/OraforgeEtims.exe')) { throw 'Portable ZIP missing eTIMS helper' }
          } finally { $zip.Dispose() }
      - uses: actions/upload-artifact@v4
        with:
          name: oraforge-pos-windows-portable
          path: |
            dist/windows/OraforgePOS-Windows-x64.zip
            dist/windows/OraforgePOS-Windows-x64.zip.sha256
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: oraforge-pos-windows-installer
          path: |
            dist/windows/installer/OraforgePOS-Setup-Windows-x64.exe
            dist/windows/installer/OraforgePOS-Setup-Windows-x64.exe.sha256
          retention-days: 30
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/windows/OraforgePOS-Windows-x64.zip
            dist/windows/OraforgePOS-Windows-x64.zip.sha256
            dist/windows/installer/OraforgePOS-Setup-Windows-x64.exe
            dist/windows/installer/OraforgePOS-Setup-Windows-x64.exe.sha256
