name: Build Oraforge POS Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('capacitor/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Validate APK JavaScript
        working-directory: capacitor
        run: |
          node --check www/app.js
          node --check www/admin.js
          node --test tests/*.cjs
          node --check www/shop-registry.js
          node --check www/shop-profile-sync.js
          node --check www/shop-registration.js
          node --check www/shop-login-force.js
          node --check www/image-search-sync.js
          node --check www/admin-shop-sync.js
          node --check www/admin-local-fixes.js
          node --check www/product-camera.js

      - name: Install Capacitor and SQLite dependencies
        working-directory: capacitor
        run: npm install

      - name: Build local SQLite bridge
        working-directory: capacitor
        run: npm run build:bridge

      - name: Add Android platform
        working-directory: capacitor
        run: npx cap add android

      - name: Install native receipt printing
        working-directory: capacitor
        run: node install-native-print.js

      - name: Sync Capacitor and native plugins
        working-directory: capacitor
        run: npx cap sync android

      - name: Enable Android internet, cleartext API and camera access
        working-directory: capacitor/android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/AndroidManifest.xml')
          s = p.read_text()
          for perm in ['android.permission.INTERNET', 'android.permission.CAMERA']:
              line = f'<uses-permission android:name="{perm}" />'
              if line not in s:
                  s = s.replace('<application', line + '\n    <application', 1)
          if 'android:usesCleartextTraffic=' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          p.write_text(s)
          print(p.read_text())
          PY

      - name: Build debug APK
        working-directory: capacitor/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK exists
        run: test -s capacitor/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oraforge-pos-apk
          path: capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
